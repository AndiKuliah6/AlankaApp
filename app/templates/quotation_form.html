{% extends 'base.html' %}{% set heading = 'New quotation' %}{% block content %}<form method="post" action="/quotations" class="panel quotation-form"><div class="form-grid"><label>Customer<select name="customer_id" required>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label><label>Pajak<input name="tax" id="tax" type="number" step="0.01" value="0"></label></div><div class="panel-head"><div><span class="eyebrow">QUOTATION TABLE</span><h2>Daftar penawaran</h2></div><span class="muted">Harga disnapshot saat disimpan</span></div><div class="quote-table-wrap"><table class="quote-table"><thead><tr><th>No</th><th>Deskripsi</th><th>Qty</th><th>Satuan</th><th>Harga</th><th>Total</th></tr></thead><tbody>{% for i in range(6) %}<tr><td>{{ i + 1 }}</td><td><select name="product_id" class="item-select"><option value="">Pilih produk / jasa</option>{% for p in products %}<option value="{{ p.id }}" data-price="{{ p.selling_price }}" data-unit="{{ p.unit }}">{{ p.name }}</option>{% endfor %}</select></td><td><input name="quantity" class="item-quantity" type="number" min="0" step="0.01" value="0" aria-label="Quantity"></td><td class="item-unit">-</td><td class="item-price">-</td><td class="item-total">-</td></tr>{% endfor %}</tbody></table></div><div class="quote-summary"><label>Diskon total<input name="discount" id="discount" type="number" step="0.01" value="0"></label><div class="quote-total"><span>Grand total</span><strong id="grand-total">Rp 0</strong></div></div><label>Catatan<textarea name="notes" placeholder="Syarat pembayaran, masa berlaku, atau catatan lainnya"></textarea></label><button class="primary" type="submit">Simpan draft quotation</button></form><script>const rows=[...document.querySelectorAll('.quote-table tbody tr')];const discount=document.getElementById('discount');const tax=document.getElementById('tax');const money=value=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(value||0);function recalc(){let subtotal=0;rows.forEach(row=>{const option=row.querySelector('.item-select').selectedOptions[0];const qty=Number(row.querySelector('.item-quantity').value||0);const price=Number(option?.dataset.price||0);const total=qty*price;subtotal+=total;row.querySelector('.item-unit').textContent=option?.dataset.unit||'-';row.querySelector('.item-price').textContent=price?money(price):'-';row.querySelector('.item-total').textContent=total?money(total):'-';});document.getElementById('grand-total').textContent=money(subtotal-Number(discount.value||0)+Number(tax.value||0));}document.querySelectorAll('.item-select,.item-quantity,#discount,#tax').forEach(field=>field.addEventListener('input',recalc));recalc();</script>{% endblock %}
